<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FlowTrack Orchestrator</title>
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header>
    <h1>FlowTrack Orchestrator</h1>
    <div id="status">
      <span id="conn-state" class="off">●</span>
      <span id="conn-label">connecting...</span>
      <span class="sep">|</span>
      <span id="dry-run-badge"></span>
      <span class="sep">|</span>
      <span id="instances-count">0 instances</span>
      <span class="sep">|</span>
      <span id="budget-badge" class="budget-ok">$0 / —</span>
      <span class="sep">|</span>
      <span id="last-event">no events yet</span>
    </div>
  </header>

  <main>
    <section id="board"></section>

    <aside id="side-panel">
      <details id="discovery-panel" open>
        <summary>
          <span class="panel-title">Discovery inbox</span>
          <span id="discovery-count" class="panel-count">0</span>
        </summary>
        <ul id="discovery-list"></ul>
      </details>

      <details id="instances-section" open>
        <summary>
          <span class="panel-title">Active instances</span>
          <span id="instances-section-count" class="panel-count">0</span>
        </summary>
        <ul id="instances-list"></ul>
      </details>

      <details id="budget-section">
        <summary>
          <span class="panel-title">Budget</span>
          <span id="budget-section-status" class="panel-count">—</span>
        </summary>
        <div id="budget-windows"></div>
      </details>

      <details id="settings-panel">
        <summary>
          <span class="panel-title">Settings</span>
        </summary>
        <div id="settings-body">
          <p class="settings-loading">Loading…</p>
        </div>
      </details>

      <details id="roles-panel">
        <summary>
          <span class="panel-title">Roles</span>
        </summary>
        <div id="roles-body">
          <p class="settings-loading">Loading…</p>
        </div>
      </details>
    </aside>
  </main>

  <div id="task-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <span id="modal-ticket" class="ticket"></span>
          <span id="modal-status" class="modal-status-badge"></span>
        </div>
        <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      </div>
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-description" class="modal-description"></p>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/web/app.js"></script>
</body>
</html>
